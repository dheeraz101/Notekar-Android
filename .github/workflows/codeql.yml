name: "CodeQL Advanced"

on:
  push:
    branches:
      - main
      - Main

  pull_request:
    branches:
      - main
      - Main

  schedule:
    - cron: "32 19 * * 5"

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - java-kotlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      ####################################################
      # Flutter setup (only needed for Java/Kotlin build)
      ####################################################
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        if: matrix.language == 'java-kotlin'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle Cache
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle Wrapper
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Pre-provision Gradle Wrapper Distribution
        if: matrix.language == 'java-kotlin'
        run: |
          WRAPPER_DIR="$HOME/.gradle/wrapper/dists/gradle-9.1.0-bin/9agqghryom9wkf8r80qlhnts3"
          if [ ! -f "$WRAPPER_DIR/gradle-9.1.0-bin.zip.ok" ]; then
            mkdir -p "$WRAPPER_DIR"
            echo "Pre-fetching Gradle 9.1.0 distribution with resilient retries..."
            curl -L --retry 10 --retry-delay 3 --retry-all-errors \
              "https://services.gradle.org/distributions/gradle-9.1.0-bin.zip" \
              -o "$WRAPPER_DIR/gradle-9.1.0-bin.zip"
            unzip -q -o "$WRAPPER_DIR/gradle-9.1.0-bin.zip" -d "$WRAPPER_DIR"
            touch "$WRAPPER_DIR/gradle-9.1.0-bin.zip.ok"
            echo "Gradle 9.1.0 wrapper successfully provisioned."
          fi

      - name: Install Flutter dependencies
        if: matrix.language == 'java-kotlin'
        run: flutter pub get

      ####################################################
      # Initialize CodeQL
      ####################################################
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'actions' && 'none' || 'manual' }}
          tools: linked

      ####################################################
      # Build Flutter project
      ####################################################
      - name: Build Android project
        if: matrix.language == 'java-kotlin'
        run: flutter build apk --debug --no-pub

      ####################################################
      # Analyze
      ####################################################
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
