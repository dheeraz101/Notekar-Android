name: "CodeQL Advanced"

on:
  push:
    branches:
      - main
      - Main

  pull_request:
    branches:
      - main
      - Main

  schedule:
    - cron: "32 19 * * 5"

permissions:
  actions: read
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - java-kotlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      ####################################################
      # Flutter setup (only needed for Java/Kotlin build)
      ####################################################
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        if: matrix.language == 'java-kotlin'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle Cache
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle Wrapper
        if: matrix.language == 'java-kotlin'
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Pre-provision Gradle Wrapper Distribution
        if: matrix.language == 'java-kotlin'
        run: |
          WRAPPER_DIR="$HOME/.gradle/wrapper/dists/gradle-9.1.0-bin/9agqghryom9wkf8r80qlhnts3"
          if [ ! -f "$WRAPPER_DIR/gradle-9.1.0-bin.zip.ok" ]; then
            mkdir -p "$WRAPPER_DIR"
            echo "Pre-fetching Gradle 9.1.0 distribution with resilient fallback mirrors..."
            curl -f -L --retry 3 "https://services.gradle.org/distributions/gradle-9.1.0-bin.zip" -o "$WRAPPER_DIR/gradle-9.1.0-bin.zip" || \
            curl -f -L --retry 3 "https://mirrors.cloud.tencent.com/gradle/gradle-9.1.0-bin.zip" -o "$WRAPPER_DIR/gradle-9.1.0-bin.zip" || \
            curl -f -L --retry 3 "https://mirrors.huaweicloud.com/gradle/gradle-9.1.0-bin.zip" -o "$WRAPPER_DIR/gradle-9.1.0-bin.zip"
            unzip -q -o "$WRAPPER_DIR/gradle-9.1.0-bin.zip" -d "$WRAPPER_DIR"
            touch "$WRAPPER_DIR/gradle-9.1.0-bin.zip.ok"
            echo "Gradle 9.1.0 wrapper successfully provisioned."
          fi

      - name: Pre-cache Kotlin Compiler Embeddable Artifact
        if: matrix.language == 'java-kotlin'
        run: |
          KOTLIN_DIR="$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-compiler-embeddable/2.2.20"
          JAR_DIR="$KOTLIN_DIR/bb8331b7585e36ea311825b01a1c06860c055fd1"
          POM_DIR="$KOTLIN_DIR/b0e635c9dc54ff7f8bee3ffe88a6e0947332d14b"
          mkdir -p "$JAR_DIR" "$POM_DIR"

          if [ ! -f "$JAR_DIR/kotlin-compiler-embeddable-2.2.20.jar" ]; then
            echo "Pre-fetching kotlin-compiler-embeddable-2.2.20.jar from resilient mirrors..."
            curl -f -L --retry 3 "https://mirrors.tencent.com/nexus/repository/maven-public/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.20/kotlin-compiler-embeddable-2.2.20.jar" -o "$JAR_DIR/kotlin-compiler-embeddable-2.2.20.jar" || \
            curl -f -L --retry 3 "https://maven.aliyun.com/repository/public/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.20/kotlin-compiler-embeddable-2.2.20.jar" -o "$JAR_DIR/kotlin-compiler-embeddable-2.2.20.jar"
          fi

          if [ ! -f "$POM_DIR/kotlin-compiler-embeddable-2.2.20.pom" ]; then
            echo "Pre-fetching kotlin-compiler-embeddable-2.2.20.pom from resilient mirrors..."
            curl -f -L --retry 3 "https://mirrors.tencent.com/nexus/repository/maven-public/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.20/kotlin-compiler-embeddable-2.2.20.pom" -o "$POM_DIR/kotlin-compiler-embeddable-2.2.20.pom" || \
            curl -f -L --retry 3 "https://maven.aliyun.com/repository/public/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.20/kotlin-compiler-embeddable-2.2.20.pom" -o "$POM_DIR/kotlin-compiler-embeddable-2.2.20.pom"
          fi
          echo "Kotlin compiler embeddable pre-cached successfully."

      - name: Install Flutter dependencies
        if: matrix.language == 'java-kotlin'
        run: flutter pub get

      ####################################################
      # Initialize CodeQL
      ####################################################
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'actions' && 'none' || 'manual' }}
          tools: linked

      ####################################################
      # Build Flutter project
      ####################################################
      - name: Build Android project
        if: matrix.language == 'java-kotlin'
        run: flutter build apk --debug --no-pub

      ####################################################
      # Analyze
      ####################################################
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
