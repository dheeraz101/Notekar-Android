name: CI — Analyze, Test, Format & Build Verification

on:
  push:
    branches: [ main, dev, release, beta, priority, security ]
  pull_request:
    branches: [ main, dev, release, beta, priority, security ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-format-build:
    name: Analyze · Test · Format · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: flutter pub get || (sleep 5 && flutter pub get)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (dart/flutter)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Verify Android Build Compilation
        run: flutter build apk --debug --no-pub
