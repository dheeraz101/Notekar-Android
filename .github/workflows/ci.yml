name: CI — Analyze, Test, Format & Build Verification

on:
  push:
    branches: [ main, dev, release, beta, priority, security ]
  pull_request:
    branches: [ main, dev, release, beta, priority, security ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-format-build:
    name: Analyze · Test · Format · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Pre-provision Gradle Wrapper Distribution
        run: |
          WRAPPER_DIR="$HOME/.gradle/wrapper/dists/gradle-9.1.0-bin/9agqghryom9wkf8r80qlhnts3"
          if [ ! -f "$WRAPPER_DIR/gradle-9.1.0-bin.zip.ok" ]; then
            mkdir -p "$WRAPPER_DIR"
            echo "Pre-fetching Gradle 9.1.0 distribution with resilient fallback mirrors..."
            curl -f -L --retry 3 "https://services.gradle.org/distributions/gradle-9.1.0-bin.zip" -o "$WRAPPER_DIR/gradle-9.1.0-bin.zip" || \
            curl -f -L --retry 3 "https://mirrors.cloud.tencent.com/gradle/gradle-9.1.0-bin.zip" -o "$WRAPPER_DIR/gradle-9.1.0-bin.zip" || \
            curl -f -L --retry 3 "https://mirrors.huaweicloud.com/gradle/gradle-9.1.0-bin.zip" -o "$WRAPPER_DIR/gradle-9.1.0-bin.zip"
            unzip -q -o "$WRAPPER_DIR/gradle-9.1.0-bin.zip" -d "$WRAPPER_DIR"
            touch "$WRAPPER_DIR/gradle-9.1.0-bin.zip.ok"
            echo "Gradle 9.1.0 wrapper successfully provisioned."
          fi

      - name: Configure Resilient Gradle & Flutter SDK Mirrors
        run: |
          KOTLIN_CACHE="$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin/kotlin-compiler-embeddable/2.2.20/bb8331b7585e36ea311825b01a1c06860c055fd1"
          mkdir -p "$KOTLIN_CACHE"
          if [ ! -f "$KOTLIN_CACHE/kotlin-compiler-embeddable-2.2.20.jar" ]; then
            echo "Pre-fetching kotlin-compiler-embeddable-2.2.20.jar..."
            curl -f -L --retry 3 "https://mirrors.tencent.com/nexus/repository/maven-public/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.20/kotlin-compiler-embeddable-2.2.20.jar" -o "$KOTLIN_CACHE/kotlin-compiler-embeddable-2.2.20.jar" || \
            curl -f -L --retry 3 "https://maven.aliyun.com/repository/public/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.20/kotlin-compiler-embeddable-2.2.20.jar" -o "$KOTLIN_CACHE/kotlin-compiler-embeddable-2.2.20.jar" || true
          fi

          if [ -n "$FLUTTER_ROOT" ] && [ -f "$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts" ]; then
            FLUTTER_SETTINGS="$FLUTTER_ROOT/packages/flutter_tools/gradle/settings.gradle.kts"
            if ! grep -q "mirrors.tencent.com" "$FLUTTER_SETTINGS"; then
              echo "Injecting mirror repositories into Flutter SDK Gradle settings..."
              sed -i '/repositories {/a \        maven { url = java.net.URI.create("https://mirrors.tencent.com/nexus/repository/maven-public/") }\n        maven { url = java.net.URI.create("https://maven.aliyun.com/repository/public") }' "$FLUTTER_SETTINGS"
            fi
          fi

          mkdir -p "$HOME/.gradle/init.d"
          cat << 'EOF' > "$HOME/.gradle/init.d/01-mirrors.init.gradle"
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                  }
              }
              repositories {
                  maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
                  maven { url 'https://maven.aliyun.com/repository/public' }
              }
          }
          gradle.settingsEvaluated { settings ->
              settings.pluginManagement {
                  repositories {
                      maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
                      maven { url 'https://maven.aliyun.com/repository/public' }
                  }
              }
              try {
                  settings.dependencyResolutionManagement {
                      repositories {
                          maven { url 'https://mirrors.tencent.com/nexus/repository/maven-public/' }
                          maven { url 'https://maven.aliyun.com/repository/public' }
                      }
                  }
              } catch (Throwable ignored) {}
          }
          EOF
          echo "Resilient Gradle and Flutter mirrors configured."

      - name: Install dependencies
        run: flutter pub get || (sleep 5 && flutter pub get)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Analyze (dart/flutter)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Download Isar Core Binary for Unit Tests
        run: |
          curl -s -L --retry 3 https://github.com/isar/isar/releases/download/3.1.0+1/libisar_linux_x64.so -o libisar.so

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Verify Android Build Compilation
        run: flutter build apk --debug --no-pub
